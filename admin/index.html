<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공지 관리 | 2026 서울관광 ON 페스타</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/sub.css">
</head>
<body class="admin-page">
  <main class="admin-shell" id="main">
    <noscript>
      <p class="admin-noscript">관리자 페이지는 JavaScript가 필요합니다.</p>
    </noscript>
    <section class="admin-card" id="admin-login">
      <h1 class="admin-card__title">공지 관리자</h1>
      <p class="admin-card__sub">2026 서울관광 ON 페스타</p>
      <form id="admin-login-form" class="admin-form">
        <label class="admin-label" for="admin-password">관리자 비밀번호</label>
        <input class="admin-input" id="admin-password" type="password" autocomplete="current-password" required>
        <button class="admin-btn admin-btn--primary" type="submit">로그인</button>
        <p class="admin-error" id="admin-login-error" hidden role="alert"></p>
      </form>
    </section>

    <div class="admin-layout" id="admin-app" hidden>
      <aside class="admin-sidebar">
        <div class="admin-sidebar__head">
          <h1 class="admin-sidebar__title">공지 관리</h1>
          <button type="button" class="admin-btn admin-btn--ghost" id="admin-logout">로그아웃</button>
        </div>
        <button type="button" class="admin-btn admin-btn--secondary admin-btn--block" id="admin-new">+ 새 공지</button>
        <ul class="admin-notice-list" id="admin-notice-list"></ul>
      </aside>
      <section class="admin-editor">
        <h2 class="admin-editor__title" id="admin-form-title">새 공지 작성</h2>
        <form id="admin-notice-form" class="admin-form">
          <input type="hidden" id="admin-notice-id" value="">
          <label class="admin-label" for="admin-notice-title">제목</label>
          <input class="admin-input" id="admin-notice-title" type="text" required maxlength="500">
          <label class="admin-label" for="admin-notice-body">내용</label>
          <textarea class="admin-textarea" id="admin-notice-body" rows="14" required></textarea>
          <label class="admin-check">
            <input type="checkbox" id="admin-notice-pin">
            상단 고정
          </label>
          <div class="admin-form__actions">
            <button class="admin-btn admin-btn--primary" type="submit">저장</button>
          </div>
          <p class="admin-error" id="admin-form-error" hidden role="alert"></p>
        </form>
      </section>
    </div>
  </main>
  <script src="../js/notice-admin.js"></script>
</body>
</html>
