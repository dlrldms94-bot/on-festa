<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAQ | 2026 서울관광 ON 페스타</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/sub.css">
</head>
<body
  data-page="sub"
  data-base="../"
  data-nav="community"
  data-title-key="sub.faq"
  data-breadcrumb='[{"labelKey":"breadcrumb.home","href":"../index.html"},{"labelKey":"nav.community","href":"notice.html"},{"labelKey":"sub.faq"}]'>
  <a class="skip-link" href="#main" data-i18n="skipMain">본문 바로가기</a>
  <div class="sub-shell">
    <div class="sub-hero">
      <div class="sub-hero__bg" aria-hidden="true"><img src="../img/sub.jpg" alt=""></div>
      <div class="sub-hero__header">
        <div id="site-header"></div>
      </div>
      <div class="sub-hero__inner">
        <h1 class="sub-hero__title" id="sub-title">FAQ</h1>
        <div id="sub-breadcrumb"></div>
      </div>
    </div>
  </div>
  <main id="main" class="page-main">
    <div class="page-inner">
      <div class="content-card content-card--faq">
        <div class="faq-list">
          <article class="faq-item">
            <h2 class="faq-item__q">
              <span class="faq-item__mark" aria-hidden="true">Q.</span>
              <span data-i18n="faq.q1">입장료가 있나요?</span>
            </h2>
            <p class="faq-item__a" data-i18n="faq.a1">별도의 입장료 없이 무료로 참여하실 수 있습니다.
공연 관람 및 현장 체험 프로그램도 무료로 운영됩니다.</p>
          </article>
          <article class="faq-item">
            <h2 class="faq-item__q">
              <span class="faq-item__mark" aria-hidden="true">Q.</span>
              <span data-i18n="faq.q2">주차는 가능한가요?</span>
            </h2>
            <p class="faq-item__a" data-i18n="faq.a2">행사장인 남산 정상부는 일반 차량 진입 및 주차가 제한됩니다.
방문 시 대중교통 또는 남산케이블카 이용을 권장드립니다.</p>
          </article>
          <article class="faq-item">
            <h2 class="faq-item__q">
              <span class="faq-item__mark" aria-hidden="true">Q.</span>
              <span data-i18n="faq.q3">우천 시에도 진행되나요?</span>
            </h2>
            <p class="faq-item__a" data-i18n="faq.a3">가벼운 우천 시에는 정상 진행될 예정입니다.
다만, 강풍·호우 등 기상 상황에 따라 일부 프로그램이 변경 또는 취소될 수 있으며, 변동 사항은 홈페이지를 통해 안내드립니다.</p>
          </article>
        </div>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="../js/i18n.js"></script>
  <script src="../js/common.js"></script>
</body>
</html>
