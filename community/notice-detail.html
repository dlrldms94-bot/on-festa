<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공지사항 | 2026 서울관광 ON 페스타</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/sub.css">
</head>
<body
  data-page="sub"
  data-base="../"
  data-nav="community"
  data-title-key="sub.notice"
  data-breadcrumb='[{"labelKey":"breadcrumb.home","href":"../index.html"},{"labelKey":"nav.community","href":"notice.html"},{"labelKey":"sub.notice"}]'>
  <a class="skip-link" href="#main" data-i18n="skipMain">본문 바로가기</a>
  <div class="sub-shell">
    <div class="sub-hero">
      <div class="sub-hero__bg" aria-hidden="true"><img src="../img/sub.jpg" alt=""></div>
      <div class="sub-hero__header">
        <div id="site-header"></div>
      </div>
      <div class="sub-hero__inner">
        <h1 class="sub-hero__title" id="sub-title">공지사항</h1>
        <div id="sub-breadcrumb"></div>
      </div>
    </div>
  </div>
  <main id="main" class="page-main">
    <div class="page-inner">
      <article class="content-card content-card--notice-detail" id="notice-detail">
        <header class="notice-detail__head">
          <h2 class="notice-detail__title" data-notice-title></h2>
          <time class="notice-detail__date" data-notice-date datetime=""></time>
        </header>
        <div class="notice-detail__body" data-notice-body></div>
        <p class="notice-detail__error" data-notice-error hidden role="alert"></p>
        <p class="notice-detail__back">
          <a href="notice.html" class="notice-detail__back-link" data-i18n="noticePage.backToList">목록으로</a>
        </p>
      </article>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="../js/i18n.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/notice-board.js"></script>
</body>
</html>
