<!DOCTYPE html>

<body
  data-page="sub"
  data-base="../"

  <div class="sub-shell">

      <article class="overview-panel" aria-labelledby="overview-visual-title">

          <img

            width="701"
            height="83"
            decoding="async">
          <img
            class="overview-panel__tit"
            src="../img/overview-tit.png"
            alt=""
            data-i18n-alt="overviewIntro.titleAlt"
            width="1491"
            height="234"
            decoding="async">
        </header>

        <div class="overview-panel__stage">
            <div class="overview-panel__box">
              <div class="overview-panel__body">
                <p data-i18n-html="overviewIntro.p1">서울의 대표 관광명소 남산에서<br><span class="overview-mark overview-mark--yellow">한국의 전통</span>과 <span class="overview-mark overview-mark--yellow">현대문화</span>를 한자리에서 즐겨보세요!</p>

                <p class="overview-panel__closing" data-i18n-html="overviewIntro.p4">올가을, 남산에서<br><span class="overview-mark overview-mark--pink">서울의 즐거움을 ON</span> 하세요!</p>
              </div>
            </div>
            <div class="overview-panel__deco" aria-hidden="true">
