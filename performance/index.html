<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공연 | 2026 서울관광 ON 페스타</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/sub.css">
</head>
<body
  data-page="sub"
  data-base="../"
  data-nav="performance"
  data-title-key="nav.performance"
  data-breadcrumb='[{"labelKey":"breadcrumb.home","href":"../index.html"},{"labelKey":"nav.performance"}]'>
  <a class="skip-link" href="#main" data-i18n="skipMain">본문 바로가기</a>

  <div class="sub-shell">
    <div class="sub-hero">
      <div class="sub-hero__bg" aria-hidden="true"><img src="../img/sub.jpg" alt=""></div>
      <div class="sub-hero__header">
        <div id="site-header"></div>
      </div>
      <div class="sub-hero__inner">
        <h1 class="sub-hero__title" id="sub-title">공연</h1>
        <div id="sub-breadcrumb"></div>
      </div>
    </div>
  </div>

  <main id="main" class="page-main">
    <div class="page-inner">
      <div class="content-card">
        <section class="performance-layout" aria-labelledby="performance-heading">
          <h2 id="performance-heading" class="sr-only" data-i18n="performancePage.heading">
            메인 무대 공연
          </h2>

          <div class="performance-day">
            <img
              class="performance-day__date-img"
              src="../img/performance/date-day1.png"
              alt="10.02(금)"
              data-i18n-alt="performancePage.day1Label"
              width="592"
              height="265"
              decoding="async">
            <ul class="performance-day__list performance-day__list--wide-first">
              <li class="performance-card">
                <figure class="performance-card__figure">
                  <div class="performance-card__media performance-card__media--landscape">
                    <img
                      class="performance-card__img"
                      src="../img/Performance/가온소리/가온소리 최종프로필.JPEG"
                      alt=""
                      data-i18n-alt="performancePage.gaonsoriAlt"
                      width="320"
                      height="400"
                      loading="lazy">
                  </div>
                  <figcaption class="performance-card__caption">
                    <p class="performance-card__time" data-i18n="performancePage.gaonsoriTime">18:00 ~ 18:30</p>
                    <p class="performance-card__name" data-i18n="performancePage.gaonsoriName">국악&amp;클래식 앙상블 가온소리</p>
                  </figcaption>
                </figure>
              </li>
              <li class="performance-card">
                <figure class="performance-card__figure">
                  <div class="performance-card__media performance-card__media--square">
                    <img
                      class="performance-card__img"
                      src="../img/Performance/민경훈/사진 (1).jpg"
                      alt=""
                      data-i18n-alt="performancePage.minkyungAlt"
                      width="320"
                      height="400"
                      loading="lazy">
                  </div>
                  <figcaption class="performance-card__caption">
                    <p class="performance-card__time" data-i18n="performancePage.minkyungTime">18:30 ~ 19:00</p>
                    <p class="performance-card__name" data-i18n="performancePage.minkyungName">민경훈</p>
                  </figcaption>
                </figure>
              </li>
            </ul>
          </div>

          <div class="performance-day">
            <img
              class="performance-day__date-img"
              src="../img/performance/date-day2.png"
              alt="10.03(토)"
              data-i18n-alt="performancePage.day2Label"
              width="590"
              height="265"
              decoding="async">
            <ul class="performance-day__list performance-day__list--square-first">
              <li class="performance-card">
                <figure class="performance-card__figure">
                  <div class="performance-card__media performance-card__media--square performance-card__media--contain">
                    <img
                      class="performance-card__img performance-card__img--contain"
                      src="../img/Performance/원밀리언-아마존/아마존.png"
                      alt=""
                      data-i18n-alt="performancePage.amazonAlt"
                      width="1980"
                      height="2049"
                      loading="lazy">
                  </div>
                  <figcaption class="performance-card__caption">
                    <p class="performance-card__time" data-i18n="performancePage.amazonTime">17:00 ~ 18:00</p>
                    <p class="performance-card__name" data-i18n="performancePage.amazonName">원밀리언 [아마존]</p>
                  </figcaption>
                </figure>
              </li>
              <li class="performance-card">
                <figure class="performance-card__figure">
                  <div class="performance-card__media performance-card__media--landscape">
                    <img
                      class="performance-card__img"
                      src="../img/Performance/딕펑스/DPNS_딕펑스_2.jpg"
                      alt=""
                      data-i18n-alt="performancePage.dickpunksAlt"
                      width="320"
                      height="400"
                      loading="lazy">
                  </div>
                  <figcaption class="performance-card__caption">
                    <p class="performance-card__time" data-i18n="performancePage.dickpunksTime">19:00 ~ 19:30</p>
                    <p class="performance-card__name" data-i18n="performancePage.dickpunksName">딕펑스</p>
                  </figcaption>
                </figure>
              </li>
            </ul>
          </div>
        </section>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="../js/i18n.js"></script>
  <script src="../js/common.js"></script>
</body>
</html>
