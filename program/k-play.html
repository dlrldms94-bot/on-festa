<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-놀이존 | 2026 서울관광 ON 페스타</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/sub.css">
</head>
<body
  data-page="sub"
  data-base="../"
  data-nav="program"
  data-title-key="sub.kPlay"
  data-breadcrumb='[{"labelKey":"breadcrumb.home","href":"../index.html"},{"labelKey":"nav.program","href":"sponsor-zone.html"},{"labelKey":"sub.kPlay"}]'>
  <a class="skip-link" href="#main" data-i18n="skipMain">본문 바로가기</a>
  <div class="sub-shell">
    <div class="sub-hero">
      <div class="sub-hero__bg" aria-hidden="true"><img src="../img/sub.jpg" alt=""></div>
      <div class="sub-hero__header"><div id="site-header"></div></div>
      <div class="sub-hero__inner">
        <h1 class="sub-hero__title" id="sub-title">K-놀이존</h1>
        <div id="sub-breadcrumb"></div>
      </div>
    </div>
  </div>
  <main id="main" class="page-main">
    <div class="page-inner k-play-page">
      <header class="sub-visual-head">
        <h2 class="sr-only" data-i18n="sub.kPlay">K-놀이존</h2>
        <img
          class="sub-visual-head__tit"
          src="../img/k-play-zone.png"
          alt=""
          data-i18n-alt="kPlayPage.titleAlt"
          width="1932"
          height="814"
          decoding="async">
      </header>
      <div class="content-card k-play-head">
        <p class="program-zone-item__lead k-play-head__lead" data-i18n="kPlayPage.sectionLead">K-놀이존 (상시운영)</p>
      </div>
      <div class="program-zone-stack">
        <article class="program-zone-item content-card" aria-labelledby="k-play-yut-heading">
          <h3 class="sr-only" id="k-play-yut-heading" data-i18n="kPlayPage.yutTitle">윷놀이</h3>
          <figure class="program-zone-item__photo">
            <img
              src="../img/program/k-play/yutnori.jpg"
              alt=""
              data-i18n-alt="kPlayPage.yutPhotoAlt"
              width="1280"
              height="853"
              loading="lazy"
              decoding="async">
          </figure>
          <p class="program-zone-item__lead" data-i18n="kPlayPage.yutTitle">윷놀이</p>
        </article>

        <article class="program-zone-item content-card" aria-labelledby="k-play-gonggi-heading">
          <h3 class="sr-only" id="k-play-gonggi-heading" data-i18n="kPlayPage.gonggiTitle">공기놀이</h3>
          <figure class="program-zone-item__photo">
            <img
              src="../img/program/k-play/gongginori.jpg"
              alt=""
              data-i18n-alt="kPlayPage.gonggiPhotoAlt"
              width="1280"
              height="853"
              loading="lazy"
              decoding="async">
          </figure>
          <p class="program-zone-item__lead" data-i18n="kPlayPage.gonggiTitle">공기놀이</p>
        </article>

        <article class="program-zone-item content-card" aria-labelledby="k-play-jegi-heading">
          <h3 class="sr-only" id="k-play-jegi-heading" data-i18n="kPlayPage.jegiTitle">제기차기</h3>
          <figure class="program-zone-item__photo">
            <img
              src="../img/program/k-play/jegichagi.jpg"
              alt=""
              data-i18n-alt="kPlayPage.jegiPhotoAlt"
              width="1280"
              height="853"
              loading="lazy"
              decoding="async">
          </figure>
          <p class="program-zone-item__lead" data-i18n="kPlayPage.jegiTitle">제기차기</p>
        </article>

        <article class="program-zone-item content-card" aria-labelledby="k-play-tuho-heading">
          <h3 class="sr-only" id="k-play-tuho-heading" data-i18n="kPlayPage.tuhoTitle">투호놀이</h3>
          <figure class="program-zone-item__photo">
            <img
              src="../img/program/k-play/tuho.jpg"
              alt=""
              data-i18n-alt="kPlayPage.tuhoPhotoAlt"
              width="1280"
              height="853"
              loading="lazy"
              decoding="async">
          </figure>
          <p class="program-zone-item__lead" data-i18n="kPlayPage.tuhoTitle">투호놀이</p>
        </article>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="../js/i18n.js"></script>
  <script src="../js/common.js"></script>
</body>
</html>
