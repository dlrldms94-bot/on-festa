<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스페셜 체험존 | 2026 서울관광 ON 페스타</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/sub.css">
</head>
<body
  data-page="sub"
  data-base="../"
  data-nav="program"
  data-title-key="sub.sponsorZone"
  data-breadcrumb='[{"labelKey":"breadcrumb.home","href":"../index.html"},{"labelKey":"nav.program","href":"sponsor-zone.html"},{"labelKey":"sub.sponsorZone"}]'>
  <a class="skip-link" href="#main" data-i18n="skipMain">본문 바로가기</a>
  <div class="sub-shell">
    <div class="sub-hero">
      <div class="sub-hero__bg" aria-hidden="true"><img src="../img/sub.jpg" alt=""></div>
      <div class="sub-hero__header"><div id="site-header"></div></div>
      <div class="sub-hero__inner">
        <h1 class="sub-hero__title" id="sub-title">스페셜 체험존</h1>
        <div id="sub-breadcrumb"></div>
      </div>
    </div>
  </div>
  <main id="main" class="page-main">
    <div class="page-inner">
      <header class="sub-visual-head">
        <h2 class="sr-only" data-i18n="sub.sponsorZone">스페셜 체험존</h2>
        <img
          class="sub-visual-head__tit"
          src="../img/sponsor-zone-tit.png"
          alt=""
          data-i18n-alt="sponsorZonePage.titleAlt"
          width="1935"
          height="813"
          decoding="async">
      </header>

      <div class="program-zone-stack">
        <article class="program-zone-item content-card" aria-labelledby="sponsor-zone-benton-heading">
          <h3 class="sr-only" id="sponsor-zone-benton-heading" data-i18n="sponsorZonePage.bentonBrand">BENTON</h3>
          <figure class="program-zone-item__photo">
            <img
              src="../img/program/sponsor-zone/benton.png"
              alt=""
              data-i18n-alt="sponsorZonePage.bentonPhotoAlt"
              width="1536"
              height="1024"
              loading="lazy"
              decoding="async">
          </figure>
          <p class="program-zone-item__brand program-zone-item__brand--benton" data-i18n="sponsorZonePage.bentonBrand">BENTON</p>
          <p class="program-zone-item__lead" data-i18n="sponsorZonePage.bentonLead">남산에서 만나는 K-뷰티 체험</p>
          <p class="program-block__desc program-zone-item__desc" data-i18n="sponsorZonePage.bentonDesc">
            벤튼의 K-뷰티 제품을 직접 사용해보고, 이벤트에 참여해 선물까지 받아가는 K-뷰티 체험 프로그램
          </p>
        </article>

        <article class="program-zone-item content-card" aria-labelledby="sponsor-zone-hike-heading">
          <h3 class="sr-only" id="sponsor-zone-hike-heading" data-i18n="sponsorZonePage.hikeLead">남산에서 즐기는 SEOUL HIKING 체험</h3>
          <figure class="program-zone-item__photo">
            <img
              src="../img/program/sponsor-zone/hike-seoul.png"
              alt=""
              data-i18n-alt="sponsorZonePage.hikePhotoAlt"
              width="1536"
              height="1024"
              loading="lazy"
              decoding="async">
          </figure>
          <p class="program-zone-item__brand">
            <img
              class="program-zone-item__brand-logo"
              src="../img/hike-logo.png"
              alt=""
              data-i18n-alt="sponsorPage.hikeLogoAlt"
              width="484"
              height="82">
          </p>
          <p class="program-zone-item__lead" data-i18n="sponsorZonePage.hikeLead">남산에서 즐기는 SEOUL HIKING 체험</p>
          <p class="program-block__desc program-zone-item__desc" data-i18n="sponsorZonePage.hikeDesc">
            서울 도심등산관광센터의 등산용품을 직접 착용하고, 남산 등산 콘셉트의 인생네컷을 촬영하며 서울의 K-HIKING을 경험하는 포토 체험 프로그램
          </p>
        </article>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="../js/i18n.js"></script>
  <script src="../js/common.js"></script>
</body>
</html>
