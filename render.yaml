# Render Blueprint: Web Service + PostgreSQL
# Dashboard → New → Blueprint → connect repo with this file
services:
  - type: web
    name: on-festa-web
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: on-festa-db
          property: connectionString
      - key: ADMIN_PASSWORD_HASH
        sync: false

databases:
  - name: on-festa-db
    plan: basic-256mb
    databaseName: onfesta
    user: onfesta
